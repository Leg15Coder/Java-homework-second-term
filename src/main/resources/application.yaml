spring:
  application:
    name: Java homework second term
  datasource:
    url: jdbc:postgresql://localhost:5432/mts_app
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: admin
      password: someText

local:
  server:
    port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: shutdown
  server:
    base-path: /admin/actuator


resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slidingWindowSize: 100
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 5
        eventConsumerBufferSize: 10
        ringBufferSizeInClosedState: 100
        ringBufferSizeInHalfOpenState: 10

  ratelimiter:
    instances:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms

